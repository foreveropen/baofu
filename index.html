<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>30秒暴富挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    background: #0a1f0f;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #1a4a2a 0%, #0a1f0f 70%);
  }
  #stage {
    position: relative;
    width: 420px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ===== HUD ===== */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    color: #ffd700;
  }
  .hud-box { text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .hud-label { font-size: 11px; opacity: .7; letter-spacing: 2px; }
  .hud-value { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #timer { color: #fff; }
  #timer.danger { color: #ff4d6d; animation: blink .3s infinite; }
  @keyframes blink { 50% { opacity: .4; } }

  /* ===== 开始界面 ===== */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 30px;
    text-align: center;
  }
  .hidden { display: none !important; }
  .big-title {
    font-size: 42px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 4px 0 #b8860b, 0 8px 20px rgba(0,0,0,.5);
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .sub { color: rgba(255,255,255,.7); font-size: 15px; line-height: 1.7; margin-bottom: 30px; }
  .btn {
    padding: 16px 50px;
    font-size: 18px;
    font-weight: 800;
    color: #0a1f0f;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,215,0,.4);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.95); }

  /* ===== 主按钮 ===== */
  #mash-btn {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #c92a2a);
    border: 6px solid #ffd700;
    box-shadow: 0 10px 40px rgba(201,42,42,.6), inset 0 -8px 20px rgba(0,0,0,.3);
    cursor: pointer;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
    transition: transform .05s;
  }
  #mash-btn:active { transform: translate(-50%, -50%) scale(.92); }
  #mash-btn.combo {
    background: radial-gradient(circle at 35% 30%, #ffd700, #ff9500);
    color: #0a1f0f;
  }

  /* ===== 连击条 ===== */
  #combo-bar {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 10px;
    background: rgba(255,255,255,.15);
    border-radius: 5px;
    overflow: hidden;
    z-index: 4;
  }
  #combo-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ff6b6b);
    transition: width .1s;
  }
  #combo-label {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd700;
    font-weight: 900;
    font-size: 20px;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    z-index: 4;
    opacity: 0;
    transition: opacity .2s;
  }
  #combo-label.show { opacity: 1; }

  /* ===== 结算界面 ===== */
  #result-screen {
    background: rgba(10, 31, 15, .95);
    backdrop-filter: blur(8px);
  }
  #result-amount {
    font-size: 56px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 4px 20px rgba(255,215,0,.4);
    margin: 10px 0;
    font-variant-numeric: tabular-nums;
  }
  #result-title {
    font-size: 24px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 20px;
  }
  #result-cmp {
    color: rgba(255,255,255,.8);
    font-size: 14px;
    line-height: 2;
    margin-bottom: 24px;
  }
  #share-card-wrap {
    margin: 10px 0 20px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #share-card { display: block; width: 280px; }
  .row { display: flex; gap: 10px; }
  .row .btn { padding: 14px 28px; font-size: 15px; }
  .btn.secondary {
    background: rgba(255,255,255,.15);
    color: #fff;
    box-shadow: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="fx"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-box">
        <div class="hud-label">财富</div>
        <div class="hud-value" id="money">¥0</div>
      </div>
      <div class="hud-box" style="text-align:right">
        <div class="hud-label">剩余</div>
        <div class="hud-value" id="timer">30.0</div>
      </div>
    </div>

    <button id="mash-btn" class="hidden">印钞！</button>
    <div id="combo-label" class="hidden">x2 连击!</div>
    <div id="combo-bar" class="hidden"><div id="combo-fill"></div></div>

    <div id="start-screen" class="screen">
      <div class="big-title">💰<br/>30秒<br/>暴富挑战</div>
      <div class="sub">狂点按钮印钞票，手速越快赚越多<br/>30 秒后看看你是什么身价</div>
      <button class="btn" id="start-btn">开始挑战</button>
    </div>

    <div id="result-screen" class="screen hidden">
      <div style="color:rgba(255,255,255,.6);font-size:13px;letter-spacing:3px">你的身价</div>
      <div id="result-amount">¥0</div>
      <div id="result-title">街头乞丐</div>
      <div id="result-cmp"></div>
      <div id="share-card-wrap"><canvas id="share-card" width="560" height="700"></canvas></div>
      <div class="row">
        <button class="btn" id="again-btn">再来一局</button>
        <button class="btn secondary" id="save-btn">保存炫耀图</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 420, H = 720;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // ===== 状态 =====
  const DURATION = 30000;
  let state = 'start'; // start | playing | result
  let money = 0;
  let startTime = 0;
  let clicks = 0;
  let clickTimes = []; // timestamps for CPS
  let comboMult = 1;
  let comboProgress = 0;
  let goldenBills = [];
  let particles = [];
  let floatTexts = [];
  let shake = 0;

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const hud = $('hud'), moneyEl = $('money'), timerEl = $('timer');
  const mashBtn = $('mash-btn'), comboLabel = $('combo-label'), comboFill = $('combo-fill');
  const startScreen = $('start-screen'), resultScreen = $('result-screen');

  // ===== 音效 =====
  let audio = null;
  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }
  function blip(freq, dur = 0.08, vol = 0.15, type = 'square') {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }
  const sfx = {
    click: () => blip(600 + Math.random() * 200, 0.06, 0.1),
    combo: () => { blip(800, 0.1, 0.15); setTimeout(() => blip(1200, 0.12, 0.15), 60); },
    golden: () => { blip(1500, 0.15, 0.2); setTimeout(() => blip(2000, 0.2, 0.2), 100); },
    end: () => { blip(400, 0.2, 0.15); setTimeout(() => blip(300, 0.3, 0.15), 200); },
  };

  // ===== 开始 =====
  function startGame() {
    ensureAudio();
    state = 'playing';
    money = 0; clicks = 0; clickTimes = [];
    comboMult = 1; comboProgress = 0;
    goldenBills = []; particles = []; floatTexts = [];
    startTime = performance.now();
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    mashBtn.classList.remove('hidden');
    comboLabel.classList.remove('hidden');
    $('combo-bar').classList.remove('hidden');
    moneyEl.textContent = '¥0';
    timerEl.textContent = '30.0';
    timerEl.classList.remove('danger');
    requestAnimationFrame(loop);
  }

  // ===== 点击印钞 =====
  function mash(x, y) {
    if (state !== 'playing') return;
    const now = performance.now();
    if (now - startTime > DURATION) return;

    clicks++;
    clickTimes.push(now);
    // 只保留最近 1 秒的点击
    while (clickTimes.length && now - clickTimes[0] > 1000) clickTimes.shift();
    const cps = clickTimes.length;

    // 连击倍率：根据 CPS
    let targetMult = 1;
    if (cps >= 15) targetMult = 5;
    else if (cps >= 11) targetMult = 3;
    else if (cps >= 7) targetMult = 2;

    if (targetMult > comboMult) {
      comboMult = targetMult;
      comboLabel.textContent = 'x' + comboMult + ' 连击!';
      comboLabel.classList.add('show');
      mashBtn.classList.add('combo');
      sfx.combo();
      shake = 6;
    } else if (targetMult < comboMult - 1) {
      comboMult = Math.max(1, targetMult);
      if (comboMult === 1) {
        comboLabel.classList.remove('show');
        mashBtn.classList.remove('combo');
      }
    }
    comboProgress = Math.min(1, cps / 15);
    comboFill.style.width = (comboProgress * 100) + '%';

    const gain = 1 * comboMult;
    money += gain;
    moneyEl.textContent = '¥' + money;
    sfx.click();

    // 飘字
    floatTexts.push({ x: x + (Math.random() - .5) * 40, y: y, text: '+¥' + gain, life: 1, combo: comboMult > 1 });
    // 粒子
    for (let i = 0; i < 3; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - .5) * 6,
        vy: -Math.random() * 5 - 2,
        life: 1,
        color: comboMult > 1 ? '#ffd700' : '#ff6b6b',
        size: 3 + Math.random() * 4,
      });
    }

    // 随机出金币券
    if (Math.random() < 0.06 && goldenBills.length < 3) {
      goldenBills.push({
        x: 60 + Math.random() * (W - 120),
        y: 150 + Math.random() * 200,
        r: 28,
        born: now,
        life: 800,
      });
    }
  }

  // ===== 金币券点击检测 =====
  function checkGolden(x, y) {
    for (let i = goldenBills.length - 1; i >= 0; i--) {
      const g = goldenBills[i];
      const dx = x - g.x, dy = y - g.y;
      if (dx * dx + dy * dy < g.r * g.r) {
        money += 50;
        moneyEl.textContent = '¥' + money;
        goldenBills.splice(i, 1);
        sfx.golden();
        shake = 10;
        floatTexts.push({ x: g.x, y: g.y, text: '+¥50 暴击!', life: 1.2, combo: true });
        for (let j = 0; j < 20; j++) {
          particles.push({
            x: g.x, y: g.y,
            vx: (Math.random() - .5) * 10,
            vy: -Math.random() * 8 - 2,
            life: 1, color: '#ffd700', size: 4,
          });
        }
        return true;
      }
    }
    return false;
  }

  // ===== 输入 =====
  function stageX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) / r.width * W;
  }
  function stageY(clientY) {
    const r = canvas.getBoundingClientRect();
    return (clientY - r.top) / r.height * H;
  }
  canvas.addEventListener('pointerdown', (e) => {
    const x = stageX(e.clientX), y = stageY(e.clientY);
    if (state !== 'playing') return;
    if (!checkGolden(x, y)) mash(x, y);
  });
  mashBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    const r = mashBtn.getBoundingClientRect();
    mash(r.left + r.width/2, r.top + r.height/2);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && state === 'playing') {
      e.preventDefault();
      mash(W/2, H/2);
    } else if (e.code === 'Space' && state === 'start') {
      startGame();
    }
  });

  $('start-btn').addEventListener('click', startGame);
  $('again-btn').addEventListener('click', startGame);
  $('save-btn').addEventListener('click', () => {
    const c = document.getElementById('share-card');
    const a = document.createElement('a');
    a.download = '暴富挑战.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });

  // ===== 结算 =====
  function endGame() {
    state = 'result';
    sfx.end();
    mashBtn.classList.add('hidden');
    $('combo-bar').classList.add('hidden');
    comboLabel.classList.remove('show');
    hud.classList.add('hidden');

    const cps = (clicks / 30).toFixed(1);
    // 称号
    let title, titleColor;
    if (money < 100)      { title = '街头乞丐';   titleColor = '#aaa'; }
    else if (money < 250) { title = '打工人';     titleColor = '#fff'; }
    else if (money < 450) { title = '万元户';     titleColor = '#7cfc00'; }
    else if (money < 700) { title = '小老板';     titleColor = '#ffd700'; }
    else if (money < 1000){ title = '企业主';     titleColor = '#ff9f1c'; }
    else if (money < 1500){ title = '富商巨贾';   titleColor = '#ff6b6b'; }
    else                   { title = '首富继承人'; titleColor = '#ff4dff'; }

    // 对比项
    const milkTea = Math.floor(money / 15);
    const pork = Math.floor(money / 18);
    const coffee = Math.floor(money / 30);
    const rent = (money / 2000).toFixed(1);

    $('result-amount').textContent = '¥' + money;
    $('result-title').textContent = title;
    $('result-title').style.color = titleColor;
    $('result-cmp').innerHTML =
      `手速 ${cps} 次/秒 · 共点 ${clicks} 下<br/>` +
      `= ${milkTea} 杯奶茶 🧋 &nbsp; = ${pork} 斤猪肉 🥩<br/>` +
      `= ${coffee} 杯咖啡 ☕ &nbsp; = ${rent} 个月房租 🏠`;

    drawShareCard(money, title, titleColor, milkTea, pork, cps);
    resultScreen.classList.remove('hidden');
  }

  // ===== 分享卡片 =====
  function drawShareCard(amount, title, color, milkTea, pork, cps) {
    const c = document.getElementById('share-card');
    const g = c.getContext('2d');
    const w = c.width, h = c.height;
    // 背景
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#1a4a2a');
    bg.addColorStop(1, '#0a1f0f');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    // 装饰
    g.font = '60px serif';
    g.fillText('💰', 40, 100);
    g.fillText('💵', w - 100, 100);
    // 标题
    g.fillStyle = '#ffd700';
    g.font = 'bold 28px sans-serif';
    g.textAlign = 'center';
    g.fillText('30 秒暴富挑战', w/2, 90);
    // 金额
    g.fillStyle = '#fff';
    g.font = 'bold 30px sans-serif';
    g.fillText('我赚到了', w/2, 200);
    g.fillStyle = '#ffd700';
    g.font = 'bold 80px sans-serif';
    g.fillText('¥' + amount, w/2, 300);
    // 称号
    g.fillStyle = color;
    g.font = 'bold 36px sans-serif';
    g.fillText('「 ' + title + ' 」', w/2, 370);
    // 对比
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.font = '22px sans-serif';
    g.fillText(`= ${milkTea} 杯奶茶 🧋`, w/2, 450);
    g.fillText(`= ${pork} 斤猪肉 🥩`, w/2, 490);
    g.fillText(`手速 ${cps} 次/秒`, w/2, 540);
    // 底部召唤
    g.fillStyle = '#ffd700';
    g.font = 'bold 24px sans-serif';
    g.fillText('你能超过我吗？来试试 →', w/2, 620);
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.font = '16px sans-serif';
    g.fillText('foreveropen.github.io/baofu', w/2, 660);
  }

  // ===== 主循环 =====
  let lastT = performance.now();
  function loop(now) {
    const dt = now - lastT;
    lastT = now;
    if (state !== 'playing') return;

    const elapsed = now - startTime;
    const remain = Math.max(0, DURATION - elapsed);
    timerEl.textContent = (remain / 1000).toFixed(1);
    if (remain < 5000) timerEl.classList.add('danger');

    if (remain <= 0) { endGame(); return; }

    // 金币券过期
    for (let i = goldenBills.length - 1; i >= 0; i--) {
      if (now - goldenBills[i].born > goldenBills[i].life) goldenBills.splice(i, 1);
    }

    draw(now);
    requestAnimationFrame(loop);
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
      shake *= 0.85;
    }

    // 金币券
    for (const g of goldenBills) {
      const age = now - g.born;
      const lifePct = 1 - age / g.life;
      const pulse = 1 + Math.sin(now / 80) * 0.1;
      ctx.globalAlpha = lifePct;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#0a1f0f';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+50', g.x, g.y);
    }
    ctx.globalAlpha = 1;

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 飘字
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const t = floatTexts[i];
      t.y -= 1.5; t.life -= 0.02;
      if (t.life <= 0) { floatTexts.splice(i, 1); continue; }
      ctx.globalAlpha = t.life;
      ctx.fillStyle = t.combo ? '#ffd700' : '#fff';
      ctx.font = (t.combo ? 'bold 22px' : '16px') + ' sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // 初始静态帧
  draw(performance.now());
})();
</script>
</body>
</html>
